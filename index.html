<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Detection</title>
    <style>
        body { font-family: Arial, sans-serif; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>Color Detection App</h1>
    <input type="file" id="imageInput" />
    <canvas id="canvas" style="display:none;"></canvas>
    <script>
        document.getElementById('imageInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    detectColors(ctx, canvas.width, canvas.height);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function detectColors(ctx, width, height) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            let yellowCount = 0;
            let pinkCount = 0;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                // Improved thresholds for color detection
                if (r > 200 && g > 200 && b < 100) { // Yellow
                    yellowCount++;
                } else if (r > 200 && b > 200 && g < 100) { // Pink
                    pinkCount++;
                }
            }
            displayResults(yellowCount, pinkCount);
        }

        function displayResults(yellowCount, pinkCount) {
            const totalCount = yellowCount + pinkCount;
            const resultDiv = document.createElement('div');
            if (totalCount > 0) {
                if (yellowCount > pinkCount) {
                    resultDiv.innerText = `Detected Color: Yellow`;
                } else if (pinkCount > yellowCount) {
                    resultDiv.innerText = `Detected Color: Pink`;
                } else {
                    resultDiv.innerText = `Detected Colors: Yellow and Pink`;
                }
            } else {
                resultDiv.innerText = `No valid colors detected.`;
            }
            document.body.appendChild(resultDiv);
        }
    </script>
</body>
</html>
