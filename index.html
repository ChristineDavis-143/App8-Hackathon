<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LAMP Color Diagnostic App</title>

    <!-- 
    ============================================
    STYLING SECTION
    This section defines how the app looks visually.
    Includes layout, colors, fonts, and spacing.
    ============================================
    -->
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        #preview {
            margin-top: 20px;
            max-width: 300px;
            border: 2px solid #ccc;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            margin-top: 10px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- 
    ============================================
    HEADER SECTION
    Title and instructions for the user
    ============================================
    -->
    <h1>LAMP Color Diagnostic App</h1>
    <p>Upload an image of your LAMP test to determine if it is POSITIVE (yellow) or NEGATIVE (pink).</p>

    <!-- 
    ============================================
    IMAGE INPUT SECTION
    Allows user to upload an image file
    ============================================
    -->
    <input type="file" id="imageInput" accept="image/*">

    <!-- Button to trigger analysis -->
    <br>
    <button onclick="analyzeImage()">Analyze Image</button>

    <!-- 
    ============================================
    IMAGE PREVIEW
    Displays uploaded image for user confirmation
    ============================================
    -->
    <br>
    <img id="preview" src="" alt="Image Preview">

    <!-- 
    ============================================
    RESULT DISPLAY
    Shows diagnostic result to user
    ============================================
    -->
    <div id="result"></div>

    <!-- 
    ============================================
    JAVASCRIPT SECTION
    Handles:
    - Image upload
    - Pixel analysis
    - Color detection
    - Output decision
    ============================================
    -->
    <script>

        // Reference to input and preview elements
        const imageInput = document.getElementById("imageInput");
        const preview = document.getElementById("preview");

        // Variable to store uploaded image
        let uploadedImage = null;

        /*
        ============================================
        EVENT LISTENER: IMAGE UPLOAD
        When user selects a file:
        - Read file
        - Convert to displayable format
        - Show preview
        ============================================
        */
        imageInput.addEventListener("change", function(event) {
            const file = event.target.files[0];

            if (file) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    preview.src = e.target.result;

                    // Create image object for analysis
                    uploadedImage = new Image();
                    uploadedImage.src = e.target.result;
                };

                reader.readAsDataURL(file);
            }
        });

        /*
        ============================================
        MAIN FUNCTION: analyzeImage()
        This function:
        1. Draws image onto a hidden canvas
        2. Extracts pixel color data
        3. Averages RGB values
        4. Determines if image is more yellow or pink
        ============================================
        */
        function analyzeImage() {

            // Check if image exists
            if (!uploadedImage) {
                alert("Please upload an image first!");
                return;
            }

            // Create invisible canvas
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            // Set canvas size to match image
            canvas.width = uploadedImage.width;
            canvas.height = uploadedImage.height;

            // Draw image onto canvas
            ctx.drawImage(uploadedImage, 0, 0);

            /*
            ============================================
            EXTRACT PIXEL DATA
            Each pixel has:
            - Red (R)
            - Green (G)
            - Blue (B)
            - Alpha (A)
            Stored in array: [R, G, B, A, R, G, B, A...]
            ============================================
            */
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // Variables to store total color values
            let totalR = 0;
            let totalG = 0;
            let totalB = 0;

            let pixelCount = data.length / 4;

            /*
            ============================================
            LOOP THROUGH ALL PIXELS
            Add up RGB values
            ============================================
            */
            for (let i = 0; i < data.length; i += 4) {
                totalR += data[i];     // Red
                totalG += data[i + 1]; // Green
                totalB += data[i + 2]; // Blue
            }

            // Calculate average color values
            const avgR = totalR / pixelCount;
            const avgG = totalG / pixelCount;
            const avgB = totalB / pixelCount;

            console.log("Average RGB:", avgR, avgG, avgB);

            /*
            ============================================
            DECISION LOGIC
            LAMP interpretation:
            - Yellow = Positive → High Red + Green
            - Pink = Negative → High Red + Blue

            We compare which color dominates
            ============================================
            */

            let resultText = "";

            if (avgR > avgB && avgG > avgB) {
                resultText = "🟡 POSITIVE: Sample appears YELLOW (amplification detected)";
            } 
            else if (avgR > avgG && avgB > avgG) {
                resultText = "🔴 NEGATIVE: Sample appears PINK (no amplification)";
            } 
            else {
                resultText = "⚠️ UNCERTAIN: Color is ambiguous, please retest";
            }

            /*
            ============================================
            DISPLAY RESULT TO USER
            ============================================
            */
            document.getElementById("result").innerText = resultText;
        }

    </script>

</body>
</html>
